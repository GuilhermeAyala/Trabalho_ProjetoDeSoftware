name: vitta

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vitta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitta_dev}
      POSTGRES_DB: ${POSTGRES_DB:-vitta}
    ports:
      # 5433 evita conflito com um PostgreSQL local já instalado na máquina.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - vitta_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    # Cache descartável: todos os dados podem ser reconstruídos do PostgreSQL.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      # 6380 evita conflito com um Redis local que use a porta padrão 6379.
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vitta}:${POSTGRES_PASSWORD:-vitta_dev}@postgres:5432/${POSTGRES_DB:-vitta}?schema=public
      HEMOCENTRO_AUTH_SECRET: ${HEMOCENTRO_AUTH_SECRET:-vitta_dev_hemocentro_secret_change_me_2026}
      CPF_ENCRYPTION_KEY: ${CPF_ENCRYPTION_KEY:-vitta_dev_cpf_encryption_key_change_me_2026}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-VittaAdmin@2026}
      REDIS_URL: redis://redis:6379
      REDIS_CACHE_TTL_SECONDS: ${REDIS_CACHE_TTL_SECONDS:-60}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Em ambiente acadêmico, db push cria/sincroniza as tabelas no banco Docker
    # sem modificar o banco PostgreSQL local do desenvolvedor.
    command: sh -c "npx prisma db push && npm run db:seed && npm start"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  vitta_postgres_data:
