name: vitta

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vitta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitta_dev}
      POSTGRES_DB: ${POSTGRES_DB:-vitta}
    ports:
      # 5433 evita conflito com um PostgreSQL local já instalado na máquina.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - vitta_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vitta}:${POSTGRES_PASSWORD:-vitta_dev}@postgres:5432/${POSTGRES_DB:-vitta}?schema=public
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    # Em ambiente acadêmico, db push cria/sincroniza as tabelas no banco Docker
    # sem modificar o banco PostgreSQL local do desenvolvedor.
    command: sh -c "npx prisma db push && npm run db:seed && npm start"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  vitta_postgres_data:
